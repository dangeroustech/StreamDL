services:
  streamdl:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: streamdl-integration:local
    environment:
      - TICK_TIME=5
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      # run.sh asserts on `docker logs`, so keep app logs on stdout (default is file)
      - LOG_DEST=both
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FFMPEG_EXTRA_OUTPUT_OPTS=-t 15
    volumes:
      - ./output/incomplete:/app/dl
      - ./output/complete:/app/out
      - ./config:/app/config
      - ./data:/app/data
      - ./hooks:/app/hooks
      - ./output/hook-markers:/app/hook-markers

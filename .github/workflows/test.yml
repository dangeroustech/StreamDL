name: Pull Request Tests

on:
  pull_request:
    branches: [master, staging]

permissions:
  contents: read

jobs:
  Software_Tests:
    name: Software Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two Python releases still getting bugfixes; bump each October.
        python-version: ["3.14", "3.15"] # 3.14 matches the Dockerfile
    env:
      # Make uv sync/run use the matrix Python rather than whatever it finds first
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set Up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install Deps
        run: uv sync --all-extras --dev
      - name: Run Tests
        run: |
          uv run bandit -ll -c .bandit.yml -r streamdl
          uv run pytest -q
  Docker_Tests:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker Build Test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false

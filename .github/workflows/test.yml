name: Pull Request Tests

on:
  pull_request:
    branches: [master, staging]

permissions:
  contents: read

jobs:
  Software_Tests:
    name: Software Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Go: setup-go's aliases track the two supported releases automatically.
        # Python: the two releases still getting bugfixes; bump each October.
        include:
          - python-version: "3.14" # matches Dockerfile.server
            go-version: oldstable
          - python-version: "3.15"
            go-version: stable
    env:
      # Make uv sync/run use the matrix Python rather than whatever it finds first
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set Up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install Deps
        run: |
          uv sync --all-extras --dev
      - name: Run Python Tests
        run: |
          uv run bandit -ll -c .bandit.yml streamdl_proto_srv.py
          uv run pytest tests/ -v
      - name: Run Go Tests
        env:
          STREAMDL_GRPC_PORT: "50051"
          STREAMDL_GRPC_ADDR: localhost
        run: |
          uv run python streamdl_proto_srv.py &
          go test -v -count=1 ./...
  Docker_Tests:
    name: Docker Build Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [client, server]
    steps:
      - uses: actions/checkout@v7
      - name: Docker Build Test
        id: docker_build_test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: false

name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      live_channel:
        description: Twitch channel to probe first (optional, e.g. one you know is live)
        required: false
        default: ""
  schedule:
    # Daily at 20:00 UTC, when the candidate channels are most likely to be live
    - cron: "0 20 * * *"
  pull_request:
    branches: [master, staging]
    paths:
      - tests/integration/**
      - .github/workflows/integration.yml

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Integration_Tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Builds both images, then live (~2 min) and VOD (up to 3 min) phases
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run Integration Tests
        env:
          LIVE_CHANNEL: ${{ inputs.live_channel }}
        run: ./tests/integration/run.sh

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: staging
    # Include transitive deps (e.g. certifi, urllib3) so their fixes land on staging
    allow:
      - dependency-type: all
    assignees:
      - biodrone
    labels:
      - dependencies
    commit-message:
      prefix: chore 🤖
      prefix-development: chore 🤖
      include: scope
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: staging
    assignees:
      - biodrone
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore 🤖
      prefix-development: chore 🤖
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: staging
    assignees:
      - biodrone
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore 🤖
      prefix-development: chore 🤖
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: staging
    ignore:
      # Server image Python follows the CI "LTS" version, bumped by hand each October
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    assignees:
      - biodrone
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore 🤖
      prefix-development: chore 🤖
      include: scope
